<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        async function leerServicioSuppliers() {
            //Indicamos la url de nuestro fichero
            let url = "https://services.odata.org/V4/Northwind/Northwind.svc/Suppliers";
            //Realizamos petición al servicio api
            let response = await fetch(url);
            //Convertimos los datos en formato json
            let datos = await response.json();
            //Creamos variable contenido para el dibujo de los datos en la lista
            let contenido = "";
            //Pintamos options
            let options = "";
            //Recorremos todos los proveedores
            for (let proveedor of datos.value) {
                //Dibujamos los options
                options += `
                    <option value="${proveedor.SupplierID}"> ${proveedor.ContactName} </option>
                `

                //Dibujamos el contenido de los elementos de lista en la variable contenido
                contenido += `
                    <li><strong class="rojo">ID:</strong> ${proveedor.SupplierID}</li> 
                    <li><strong class="rojo">Compañía:</strong> ${proveedor.CompanyName}</li><p>
                    `
            }
            //Buscamos el select en html
            let select = document.getElementById("selectsupplier");
            //Pintamos los options en el select
            select.innerHTML = options;
            //Recuperamos el elemento html llamado proveedor
            let proveedor = document.getElementById("proveedor");
            //Pintamos el contenido dentro de este elemento proveedor
            proveedor.innerHTML = contenido;

        }

        async function buscarPorID() {
