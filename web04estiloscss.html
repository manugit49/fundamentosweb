<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* NOMBRE DE ETIQUETA */
        h2{
            background-color: yellow
        }

        p{
            font-size: 20px;
        }

        #parrafo{
            color: red;
        }

        .fondoamarillo{
            background-color: yellow;
        }
    </style>
    <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
    <p id="parrafo">Yo soy rojo</p>
    <p class="fondoamarillo">Yo no soy rojo</p>
    <p class="fondoamarillo">Yo no soy rojo</p>
    <h1>Yo no soy verde...</h1>
    <h2 style="color: blue;">Estilos CSS</h2>//Estilo en linea
    <h2>Yo no soy azul</h2>
    //Estilos a nivel de página
    //a uno o varios elementos de la página
    //Se escriben dentro head y con style
    //Por identificador en una etiqueta html ID
    //Por clases: class
</body>
</html>
