<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function getNumeroMayor()
        {
            let numero1 = 99;
            let numero2 = 88;
            //evaluar cual es el numero mayor de los dos
            //y mostrar un alert con dicho numero

            let mayor = (numero1 > numero2) ? numero1 : numero2;
            alert("El número mayor es: " + mayor);

            //Tambien comprobar si son iguales
            if (numero1 === numero2) {
                alert("Los números son iguales");
            } else {
                alert("Los números son diferentes");
            }
        }
    </script>
</head>
<body>
    <h1>Numero mayor</h1>
    <button onclick="getNumeroMayor()">
        Obtener numero mayor
    </button>
</body>
</html>
