<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        async function cargarJugadores(){
            //Indicamos la ruta del fichero donde tnemos la informacion
            let path = "documents/jugadores.json";
            //Leemos el fichero, esperando a que se termine de realizar la lectura
            let response = await fetch(path);
            //Convertimos la respuesta a un objeto json, esperando a que termine
            let jugadores = await response.json();
            //Necesito variable contenido para el dibujo de la información de cada jugador
            let contenido = "";
            //Recorremos la lista de jugadores y pintamos en contenido una fila por cada jugador
            for(let jugador of jugadores){
                contenido += `
                    <tr>
                        <td> ${jugador.jugador} </td>
                        <td><img src=' ${jugador.imagen} '/></td>;
                    </tr>
                `
            }
            
            //Recuperamos el elemento tabla con el id listajugadores
            let tabla = document.getElementById("listajugadores");
            //Pintamos las filas con contenido en el elemento tabla
            tabla.innerHTML = contenido;
        }
    </script>
    <style>
        img{
            width: 120px;
            height: 120px;
        }
    </style>
</head>
<body>
    <h1>Nombre de jugadores y su imagen</h1>
    <button onclick="cargarJugadores()">Cargar nombre e imagen de los jugadores</button>
    <table border="1" id="listajugadores"></table>
</body>
</html>
