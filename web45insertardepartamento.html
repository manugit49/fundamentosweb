<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let url = "https://apicruddepartamentoscore.azurewebsites.net/";

        async function insertarDepartamento() {
            let request = `${url}api/departamentos`;
            //buscamos la caja id del dibujo html
            let cajaid = document.getElementById("cajaid");
            //buscamos la caja nombre del dibujo html
            let cajanombre = document.getElementById("cajanombre");
            //buscamos la caja localidad el dibujo html
            let cajalocalidad = document.getElementById("cajalocalidad");
            //necesitamos enviar un objeto departamento
            //creamos un nuevo objeto
            console.log(cajaid.value);
            let nuevo = {
                "numero": parseInt(cajaid.value),
                "nombre": cajanombre.value,
                "localidad": cajalocalidad.value
            }
            //Para nviar la informacion al servicio, no puedo
            //hacerlo directamente. Tengo que utilizar JSON.stringfy
            //para convertir a JSON
            //convertimos el objeto a json
            let data = JSON.stringify(nuevo);
            //llamamaos a nuestro servicio con un POST
            let response = await fetch(request, {
                method: "POST",
                "body": data,
                headers: {
                    "Content-Type": "application/json"
                }
            })
            alert("Todo ok, Jose Luis");
        }
    </script>
</head>
<body>
    <h1>Insertar departamento</h1>
    Id: <input type="number" id="cajaid"/><br/>
    Nombre: <input type="text" id="cajanombre"/><br/>
    Localidad: <input type="text" id="cajalocalidad"/><br/>
    <button onclick="insertarDepartamento()">Insertar departamento</button>
</body>
</html>
