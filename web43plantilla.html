<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let url = "https://apiplantillacore.azurewebsites.net/";
        async function cargarPlantilla() {
            //Construimos la petición a la api
            let request = url + "api/Plantilla";
            //Realizamos la petición al servicio
            let response = await fetch(request);
            //Convertimos los datos a formato json
            let datos = await response.json();
            //Creamos variable contenido para incluir la información a pintar en la lista
            let contenido = "";
            //Recorremos todos los empleados de la plantilla
            for(let empleado of datos){
                contenido += `
                    <li>Apellido: ${empleado.apellido}</li>
                    <li>Función: ${empleado.funcion}</li>
                    <li>${empleado.turno}</li><p></p>
                `
            }
            //Recuperamos el elemento ul del dibujo html para incluir el contenido en la lista
            let lista = document.getElementById("listaplantilla");
            //Dibujamos el contenido en la lista
            lista.innerHTML = contenido;
        }

        async function datosPlantilla(){
            //Recupero el elemento select del dibujo
            let select = document.getElementById("funcionplantilla");
            //Almacenamos el valor de la select seleccionado
            let funcion = select.value;
            console.log(funcion);
            //Construimos la petición a la api
            let request = url + "api/Plantilla/PlantillaFuncion/" + funcion;
            //Realizamos la petición al servicio
            let response = await fetch(request);
            //Convertimos los datos a formato json
            let datos = await response.json();
            //Creamos variable contenido para la información a pintar por cada empleado con la funcion indicada
            let contenido = "";
            //Recorremos los datos de la plantilla de cada empleado
            for(let empleado of datos){
                if(empleado.funcion == funcion){
                    contenido += `
                        <li>${empleado.idEmpleado}, ${empleado.idHospital}, ${empleado.idSala}, ${empleado.apellido}, ${empleado.turno}</li>
                    `                
                }
            }
            //Recuperamos el elemento ul del dibujo
            let lista = document.getElementById("datosplantilla");
            //Pintamos en la lista
            lista.innerHTML = contenido;
        } 
    </script>
</head>
<body>
    <h1>Api Plantilla</h1>
    <button onclick="cargarPlantilla()">Cargar plantilla</button>
    <ul id="listaplantilla"></ul>

    <select id="funcionplantilla"></select>
    <button onclick="datosPlantilla()">datosPlantilla</button>
    <ul id="datosplantilla"></ul>
</body>
</html>
