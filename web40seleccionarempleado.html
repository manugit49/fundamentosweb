<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let url = "https://apiempleadosfullstack.azurewebsites.net/";
        async function cargarApellidos() {
            //Incluimos la peticón en la url
            let request = url + "api/Empleados";
            //Realizamos la petición al servicio
            let response = await fetch(request);
            //Convertimos los datos a formato json
            let datos = await response.json();
            //Creamos variable options que pinte en el select las option correspondiente a cada apellido a cargar
            let options = "";
            //Recorremos los datos de empleados
            for(let d of datos){
                options += `
                    <option value="${d.idEmpleado}"> ${d.apellido} </option>
                `
            }
            console.log(options);
            //Recuperamos el elemento select del dibujo html
            let select = document.getElementById("listaapellidos");
            //Pintamos el contenido, es decir, las option
            select.innerHTML = options;
        }

        async function buscarEmpleado() {
            //api/Empleados/7369
            //Recupero el elemento select del dibujo html
            let select = document.getElementById("listaapellidos");
            console.log(select);
            //Guardo el valor seleccionado del select corespodiente al id del empleado
            let idempleado = select.value;
            //construimos la peticion
            let request = url + "api/empleados/" + idempleado;
            //console.log(url);
            //Realizamos la petición al servicio
            let response = await fetch(request);
            //Convertimos los datos a formato json
            let datos = await response.json();
            //Recupero el elemento div del dibujo html
            let div = document.getElementById("datosempleado");
            //Dibujamos el contenido html dentro del div
            div.innerHTML = `
                <p>${datos.apellido}</p>
                <p>${datos.oficio}</p>
                <p>${datos.salario}</p>
            `
        }
    </script>
</head>
<body>
    <h1>Api Selección Empleado</h1>
    <button onclick="cargarApellidos()">Cargar apellidos</button>
    <select id="listaapellidos"></select><p></p>
    <button onclick="buscarEmpleado()">Buscar empleado</button>
    <div id="datosempleado"></div>
</body>
</html>
