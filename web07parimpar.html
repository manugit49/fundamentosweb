<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function evaluarNumero() {
            //LA DELCARACION DE LA VARIABLE PARA TRABAJAR
            let numero = 14;
            //evaluar si el numero es par o impar
            if (numero % 2 === 0) {
                alert("El numero es par");
            } else {
                alert("El numero es impar");
            }
        }
    </script>
</head>
<body>
    <h1>Ejemplo par - impar</h1>
    <button onclick="evaluarNumero()">
        Evaluar Número
    </button>
</body>
</html>
